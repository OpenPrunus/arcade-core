# CI sur le Gitea interne (git.prunus.dev, runner LXC 111). GitHub n'est qu'une sauvegarde : pas de CI là-bas.
name: CI

on:
  push:
    branches: [main]
    # Jamais sur une étiquette (Gitea lancerait sinon la CI de chaque étiquette poussée)
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  # Le groupe est partagé entre dépôts sur Gitea : le nom du dépôt y figure
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Seuil minimal de couverture des lignes (%) : la CI échoue s'il baisse
  COVERAGE_MIN: 47

jobs:
  php:
    name: PHP 8.5 (PSR-12, static analysis, tests, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring
          tools: composer
          coverage: pcov
      - run: composer install --no-interaction --prefer-dist
      - name: Coding standard (PSR-12) et analyse statique
        run: composer cs && composer stan
      - name: Tests et couverture
        run: vendor/bin/phpunit --colors=never --coverage-text --coverage-clover=clover.xml 2>&1 | tee coverage.txt
      - name: Résumé et seuil de couverture
        run: |
          { echo '### Couverture du code'; echo '```'; grep -A6 'Code Coverage Report' coverage.txt; echo '```'; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          pct=$(grep -E '^\s+Lines:' coverage.txt | head -1 | sed -E 's/.*Lines:\s+([0-9.]+)%.*/\1/')
          test -n "$pct" || { echo 'taux de couverture introuvable'; exit 1; }
          echo "Couverture des lignes : ${pct} % (minimum ${COVERAGE_MIN} %)"
          awk -v p="$pct" -v m="$COVERAGE_MIN" 'BEGIN{exit !(p+0 >= m+0)}'
